[package]
name = "tfp-sim"
description = "Deterministic, rollback-able game simulation (no I/O, no rendering)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
bytemuck.workspace = true
tfp-assets.workspace = true

[dev-dependencies]

[[bin]]
name = "sim-bench"
path = "src/bin/sim_bench.rs"

[[bin]]
name = "sim-trace"
path = "src/bin/sim_trace.rs"

[[bin]]
name = "sim-checksums"
path = "src/bin/sim_checksums.rs"

[[bin]]
name = "sim-rollback-fuzz"
path = "src/bin/rollback_fuzz.rs"
